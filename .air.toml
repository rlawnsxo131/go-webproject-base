root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  include_dir = ["cmd", "internal", "x"]
  include_ext = ["go", "tpl", "tmpl", "html", "toml"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]

  cmd = "CGO_ENABLED=0 go build -o ./tmp/main ./cmd/main.go"
  
  full_bin = "APP_ENV=dev APP_PORT=8080 APP_TIMEZONE=Asia/Seoul ./tmp/main"
  
  delay = 1000
  
  rerun = false
  rerun_delay = 500
  
  kill_delay = "0ms"
  send_interrupt = true

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true